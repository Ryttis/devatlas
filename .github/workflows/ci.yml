name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: |
            go.sum
            connector/go.sum
      - name: Verify toolchain
        run: |
          go version
          git --version
          cc --version
      - name: Validate formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Build
        run: go build -trimpath -o bin/devatlas ./cmd/devatlas
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...

      - name: Verify agent pilot and deployment regressions
        run: |
          bash -n scripts/deploy-web.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -v

      - name: Verify MCP connector
        working-directory: connector
        run: |
          go build ./...
          go vet ./...
          go test -race ./...
